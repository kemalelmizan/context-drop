<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 228" width="960" height="228" role="img" aria-labelledby="cd-hero-title cd-hero-desc">
  <title id="cd-hero-title">ContextDrop — Contextual Feedback Engine, Pin-Drop DOM Selector, and MCP Server for Ruby on Rails</title>
  <desc id="cd-hero-desc">Self-hosted Ruby on Rails engine pairing a Shadow DOM floating chatbox and overlapping-layer DOM element picker with Active Storage screenshots, a triage dashboard, and an IDE Model Context Protocol server.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="958" height="226" rx="16" ry="16" />
    </clipPath>
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111318" flood-opacity="0.18" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111318" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Warm Paper Shell -->
  <g clip-path="url(#card-clip)">
    <rect x="1" y="1" width="958" height="226" fill="#faf9f6" />

    <!-- Top Recessed Stone Instrument Bar -->
    <rect x="1" y="1" width="958" height="46" fill="#f1efea" />
    <line x1="1" y1="47" x2="959" y2="47" stroke="#d6d3cd" stroke-width="1" />

    <!-- Top-Left Asymmetric Pushpin Button (11px 11px 11px 3px) -->
    <path d="M 27 10 H 127 A 11 11 0 0 1 138 21 V 27 A 11 11 0 0 1 127 38 H 19 A 3 3 0 0 1 16 35 V 21 A 11 11 0 0 1 27 10 Z" fill="#c2410c" />
    <g transform="translate(24, 15) scale(0.88)" fill="none" stroke="#faf9f6" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.8 3.2l5 5-2.1 2.1-1.8-.6-3.2 3.2.6 2.5-1.6 1.6-3.1-3.1-3.1 3.1v-.1l3.1-3.1-3.1-3.1 1.6-1.6 2.5.6 3.2-3.2-.6-1.8 2.1-2.1z" />
    </g>
    <text x="46" y="28.5" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#faf9f6">Pin Element</text>

    <!-- Live DOM Breadcrumb Strip in Top Bar -->
    <text x="154" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#4b5262">main.checkout-shell</text>
    <polyline points="292 21 296 24.5 292 28" fill="none" stroke="#5c6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="304" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#4b5262">section#order-summary</text>
    <polyline points="461 21 465 24.5 461 28" fill="none" stroke="#5c6478" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Active Inspector Cobalt Breadcrumb Pill -->
    <rect x="473" y="13" width="149" height="22" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
    <text x="483" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1e40af">button#submit-order</text>

    <!-- Right Gem Badge -->
    <rect x="786" y="11" width="156" height="26" rx="6" fill="#111318" />
    <text x="864" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#faf9f6">gem "context_drop"</text>

    <!-- Left Column: Brand Title, Pitch, and Technical Badges -->
    <text x="28" y="96" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#111318">ContextDrop</text>

    <text x="28" y="128" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#111318">Turn vague bug reports into surgical DOM context for Ruby on Rails.</text>
    <text x="28" y="152" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5262">Self-hosted Rails Engine with a Shadow DOM chatbox, overlapping-layer pin selector,</text>
    <text x="28" y="171" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4b5262">privacy-redacted screenshots, triage dashboard, and native IDE MCP server.</text>

    <!-- Bottom Spec Pills -->
    <g transform="translate(28, 187)">
      <rect x="0" y="0" width="122" height="24" rx="6" fill="#f1efea" stroke="#d6d3cd" stroke-width="1" />
      <text x="61" y="15.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#111318">Rails 7.1 - 8.0+</text>

      <rect x="130" y="0" width="144" height="24" rx="6" fill="#f1efea" stroke="#d6d3cd" stroke-width="1" />
      <text x="202" y="15.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#111318">Shadow DOM Widget</text>

      <rect x="282" y="0" width="128" height="24" rx="6" fill="#f1efea" stroke="#d6d3cd" stroke-width="1" />
      <text x="346" y="15.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#111318">Active Storage</text>

      <rect x="418" y="0" width="154" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
      <text x="495" y="15.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#1e40af">MCP: stdio &amp; HTTP</text>
    </g>

    <!-- Right Column: Tactile Layer Disambiguation & Pin Loupe Illustration -->
    <g transform="translate(624, 62)">
      <!-- Host App Recessed Frame -->
      <rect x="0" y="0" width="310" height="148" rx="12" fill="#f1efea" stroke="#d6d3cd" stroke-width="1" />

      <!-- Underlying Container Layer (Ghost Dashed Outline) -->
      <rect x="14" y="14" width="282" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 3" filter="url(#card-shadow)" />
      <text x="26" y="34" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111318">Enterprise Multi-Region Cluster</text>
      <text x="234" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#4b5262">$1,290/mo</text>
      <rect x="26" y="44" width="168" height="6" rx="3" fill="#e2e8f0" />
      <rect x="26" y="56" width="132" height="6" rx="3" fill="#e2e8f0" />

      <!-- Redacted Sensitive Block Preview -->
      <rect x="26" y="72" width="124" height="20" rx="4" fill="#111318" opacity="0.88" />
      <text x="34" y="85.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" fill="#faf9f6">[REDACTED SENSITIVE]</text>

      <!-- Target Highlighted Element (Inspector Cobalt Bounding Box) -->
      <rect x="164" y="82" width="120" height="38" rx="6" fill="#dbeafe" fill-opacity="0.45" stroke="#1d4ed8" stroke-width="2" />
      <rect x="170" y="88" width="108" height="26" rx="5" fill="#111318" />
      <text x="224" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#faf9f6">Provision Now</text>

      <!-- Inspector HUD Pill Above Selected Target -->
      <rect x="92" y="56" width="194" height="20" rx="5" fill="#111318" />
      <text x="189" y="69.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#faf9f6">button#submit-order · 2/4 layers</text>

      <!-- Asymmetric Pin Marker Anchored at Target Corner -->
      <g transform="translate(272, 68)" filter="url(#pin-shadow)">
        <path d="M 12 0 H 14 A 11 11 0 0 1 25 11 V 13 A 11 11 0 0 1 14 24 H 3 A 3 3 0 0 1 0 21 V 11 A 11 11 0 0 1 11 0 Z" fill="#c2410c" stroke="#faf9f6" stroke-width="1.5" />
        <g transform="translate(4.5, 4) scale(0.8)" fill="none" stroke="#faf9f6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.8 3.2l5 5-2.1 2.1-1.8-.6-3.2 3.2.6 2.5-1.6 1.6-3.1-3.1-3.1 3.1v-.1l3.1-3.1-3.1-3.1 1.6-1.6 2.5.6 3.2-3.2-.6-1.8 2.1-2.1z" />
        </g>
      </g>
    </g>
  </g>

  <!-- Outer 1px Hairline Stone Border -->
  <rect x="0.5" y="0.5" width="959" height="227" rx="16" ry="16" fill="none" stroke="#d6d3cd" stroke-width="1" />
</svg>
